project:
  type: website
  output-dir: site

bibliography: references.bib

execute:
  # `auto` re-executes a page only when its source changed. Without it every
  # render recomputes the replication tutorials, which takes minutes.
  freeze: auto
  cache: true
  warning: false
website:
  page-navigation: true
  bread-crumbs: true


  search:
    show-item-context: true
    type: overlay

  navbar:
    # Julia blue, matching the circle outlines in op_logo.svg and the landing
    # page accents. `primary` would be #593196, the pulse theme's own violet,
    # which is not one of the Julia colours.
    background: "#4063d8"
    logo: op_logo.svg
    # The package name sits in the brand slot beside the logo rather than as a
    # nav link, so it reads as the site title. Weight is set in styles.css.
    title: "StatsOrdinalPatterns.jl"

    left:
      - text: "Ordinal Patterns"
        href: page_files/op.qmd
      - text: "Spatial Ordinal Patterns"
        href: page_files/sop.qmd
      - text: "Generalized Ordinal Patterns"
        href: page_files/gop_tutorials.qmd
      - text: "API"
        href: page_files/api_reference.qmd

    tools:
    - icon: github
      href: https://github.com/AdaemmerP/StatsOrdinalPatterns.jl
      text: "StatsOrdinalPatterns.jl"

  sidebar:
    - title: "API"    
      style: "docked"
      background: light
      collapse-level: 1
      contents:
        - page_files/api_reference.qmd
        - section: "Types for ordinal patterns"
          contents:
            - reference/AAR1.qmd
            - reference/AR1.qmd
            - reference/MA1.qmd
            - reference/MA2.qmd
            - reference/TEAR1.qmd
            - reference/QAR1.qmd
        - section: "Types for generalized ordinal patterns"
          contents:
            - reference/D_Chart.qmd
        - section: "SOP classifications"
          contents:
            - reference/SOPClassification.qmd
            - reference/OrdinaryType.qmd
            - reference/RefinedType.qmd
            - reference/RotationType.qmd
            - reference/DirectionType.qmd
            - reference/DiagonalType.qmd
        - section: "Types for spatial ordinal patterns"
          contents:
            - reference/SAR11.qmd
            - reference/SINAR11.qmd
            - reference/SAR1.qmd
            - reference/SQINMA11.qmd
            - reference/SQMA11.qmd
        - section: "Functions for ordinal patterns"
          contents:
            - reference/arl_op_ic.qmd
            - reference/arl_op_oc.qmd
            - reference/cl_op.qmd
            - reference/crit_val_op.qmd
        - section: "Functions for generalized ordinal patterns"
          contents:
            - reference/arl_gop_ic.qmd
            - reference/arl_gop_oc.qmd
            - reference/cl_gop.qmd
            - reference/stat_gop.qmd
            - reference/chart_stat_gop.qmd
            - reference/test_gop_bootstrap.qmd
        - section: "Functions for spatial ordinal patterns"
          contents:
            - reference/arl_sop_ic.qmd
            - reference/arl_sop_oc.qmd
            - reference/cl_sop.qmd
            - reference/arl_sacf_ic.qmd
            - reference/arl_sacf_oc.qmd
        - section: "Monitoring observed data"
          contents:
            - reference/ControlChartResult.qmd
            - reference/monitor_op.qmd
            - reference/monitor_sop.qmd
    - title: "SOPs"
      style: "docked"
      background: light
      collapse-level: 1
      contents:
        - page_files/sop.qmd
        - page_files/sop_tutorial.qmd
        - page_files/sop_sequential.qmd
        - page_files/plotting.qmd
        - section: "Replications"
          contents:
            - text: "Weiß and Kim (2024)"
              href: page_files/sop_replication_weiss_kim_2024.qmd
            - text: "Weiß and Kim (2025)"
              href: page_files/sop_replication_weiss_kim_2025.qmd
        # - page_files/sop_replication.qmd
    - title: "OPs"
      style: "docked"
      background: light
      contents:
        - page_files/op.qmd
        - page_files/op_tutorial.qmd
        - page_files/op_sequential.qmd
        - page_files/plotting.qmd
        - section: "Replications"
          contents:
            - text: "Weiß (2022)"
              href: page_files/op_replication_weiss_2022.qmd
            - text: "Weiß and Testik (2023)"
              href: page_files/op_replication_weiss_testik_2023.qmd
        #- page_files/op_dependence.qmd
        #- page_files/op_changepoint.qmd
        #- page_files/op_replication.qmd

  page-footer: "Website generated with [Quarto](https://quarto.org/) and [QuartoDocBuilder.jl](https://github.com/vituri/QuartoDocBuilder.jl)"


engine: julia

format:
  html:
    theme: pulse # cosmo flatly materia minty pulse spacelab
    css: styles.css
    code-copy: true
    code-overflow: wrap
    preview-links: true
    toc: true
    toc-depth: 3
    toc-expand: true 
